<!-- SPA REFRESH SUPPORT (VS Code Live Server / static hosting)
     Live Server has no History API fallback, so refreshing a
     clean route like /browse would 404. This registers sw.js,
     which serves index.html ONLY when the server returns 404
     for a top-level navigation. URLs, query strings and
     /vehicle/:id stay exactly as requested. Safe no-op in
     browsers without service worker support.

     PHASE 3 — sw.js additionally caches SAME-ORIGIN static
     assets (CSS / JS / fonts / images) with stale-while-
     revalidate and versioned caches (hufa-static-v*, purged
     on activation). Cross-origin requests — Supabase auth /
     DB / storage, CDN libraries, Google Fonts — are never
     intercepted and never cached. Documents (index.html)
     stay network-first, so users can never be trapped on
     stale application code. -->

<script>

(function(){

  if(!("serviceWorker" in navigator)){
    return;
  }

  navigator.serviceWorker
    .register("/sw.js")
    .catch(function(){

      /* Fallback for sub-path deployments */
      navigator.serviceWorker
        .register("sw.js")
        .catch(function(){});

    });

})();

</script>

<!-- PERFORMANCE OBSERVER -->
<script>

window.__APP_START__ =
performance.now();

/* =====================================
ERROR TRACKING
===================================== */

window.addEventListener(
"error",
(event)=>{

/* PHASE 4 — message + stack only. The raw
   error object (which could carry auth
   payloads) is never dumped to the console. */

console.error(
"[APP ERROR]",
event.message || "Unknown error"
);

}
);

/* =====================================
UNHANDLED PROMISES
===================================== */

window.addEventListener(
"unhandledrejection",
(event)=>{

/* PHASE 4 — reason is reduced to a string so
   no promise rejection value (which could be a
   session/token-bearing object) is echoed. */

console.error(
"[PROMISE ERROR]",
((
typeof event.reason === "object" &&
event.reason !== null &&
typeof event.reason.message === "string"
) ? event.reason.message : String(event.reason))
);

}
);

/* =====================================
PERFORMANCE LOGGING
===================================== */

window.addEventListener(
"load",
()=>{

const loadTime =
(
performance.now()
-
window.__APP_START__
).toFixed(2);

console.log(
`[APP LOADED] ${loadTime}ms`
);

}
);

</script>
